services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/852r-panel-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - db:/app/data
      - logs:/app/logs
      - ./secrets:/app/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - panel_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/${GHCR_OWNER}/852r-panel-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_COLOR_STAFF: ${VITE_COLOR_STAFF}
        VITE_COLOR_LUMINARY: ${VITE_COLOR_LUMINARY}
        VITE_COLOR_PRESTIGE: ${VITE_COLOR_PRESTIGE}
        VITE_COLOR_VICE: ${VITE_COLOR_VICE}
        VITE_COLOR_SENATOR: ${VITE_COLOR_SENATOR}
        VITE_COLOR_DIGNITARY: ${VITE_COLOR_DIGNITARY}
        VITE_COLOR_ATTACHE: ${VITE_COLOR_ATTACHE}
        VITE_COLOR_CITIZEN: ${VITE_COLOR_CITIZEN}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_CRAFTY_URL: ${VITE_CRAFTY_URL}
    restart: unless-stopped
    volumes:
      - ./nginx/panel.conf:/etc/nginx/conf.d/panel.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - panel_net

networks:
  panel_net:
    driver: bridge

volumes:
  db:
  logs: